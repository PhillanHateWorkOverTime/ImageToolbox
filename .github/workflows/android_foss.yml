name: Android CI FOSS

on:
  workflow_dispatch:
  push:
    branches: [ auto-tone ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          java-package: 'jdk'
          cache: gradle

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            gradle-build-cache-${{ github.ref }}-
            gradle-build-cache-

      - name: Build FOSS APKs (unsigned)
        run: bash ./gradlew assembleFossRelease --build-cache --max-workers=2

      - name: Set up Keystore
        run: |
          mkdir -p $RUNNER_TEMP/keystores
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks
          ls -la $RUNNER_TEMP/keystores

      - name: Sign arm64 APK
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/35.0.0
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/foss/release/*arm64-v8a*.apk | head -1)
          echo "source apk: $APK"
          $BT/zipalign -f -p 4 "$APK" dist/aligned.apk
          $BT/apksigner sign \
            --ks $RUNNER_TEMP/keystores/keystore.jks \
            --ks-key-alias ${{ secrets.ALIAS }} \
            --ks-pass pass:${{ secrets.KEY_STORE_PASS }} \
            --key-pass pass:${{ secrets.KEY_STORE_PASS }} \
            --out dist/ImageToolbox-custom-arm64.apk \
            dist/aligned.apk
          $BT/apksigner verify --print-certs dist/ImageToolbox-custom-arm64.apk
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="auto-tone-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          gh release create "$TAG" dist/ImageToolbox-custom-arm64.apk \
            --repo "${{ github.repository }}" \
            --title "ImageToolbox 定制版 $TAG" \
            --notes "自动构建：一键调色(Auto Tone) 6 层影调 + 模型下载走 hf-mirror + 底部栏按 Lightroom 调整。arm64-v8a。"
          echo "release tag: $TAG"
